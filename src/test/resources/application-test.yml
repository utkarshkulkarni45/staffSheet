spring:
  datasource:
    url: jdbc:h2:mem:staffsheet_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

app:
  jwt:
    # base64 of "test-only-staffsheet-key-not-a-production-secret" — not a real secret
    secret: dGVzdC1vbmx5LXN0YWZmc2hlZXQta2V5LW5vdC1hLXByb2R1Y3Rpb24tc2VjcmV0
    expiration-ms: 86400000

