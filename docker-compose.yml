services:
  postgres:
    image: postgres:16-alpine
    container_name: staffsheet-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-staffsheet}
      POSTGRES_USER: ${DB_USERNAME:-staffsheet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-staffsheet_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-staffsheet} -d ${DB_NAME:-staffsheet}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

